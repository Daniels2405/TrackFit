
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-4 mb-5">
            <h2 class="mb-4">[[#{membresia.consulta.titulo}]]</h2>

            <div th:if="${membresias.empty}"
                 class="alert alert-info">
                [[#{membresia.consulta.vacia}]]
            </div>

            <div th:unless="${membresias.empty}"
                 class="table-responsive">

                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>[[#{membresia.plan}]]</th>
                            <th>[[#{membresia.fecha.inicio}]]</th>
                            <th>[[#{membresia.fecha.vencimiento}]]</th>
                            <th>[[#{membresia.estado}]]</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="m : ${membresias}">
                            <td th:text="${m.planMembresia.nombre}"></td>

                            <td th:text="${#temporals.format(m.fechaInicio, 'dd/MM/yyyy')}"></td>

                            <td th:text="${#temporals.format(m.fechaVencimiento, 'dd/MM/yyyy')}"></td>

                            <td>
                                <span class="badge"
                                      th:classappend="${m.vigente} ? 'bg-success' : 'bg-danger'"
                                      th:text="${m.vigente} ? #{membresia.vigente} : #{membresia.vencida}">
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
