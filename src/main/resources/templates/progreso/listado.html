<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container mt-4 mb-5">

    <h2 class="mb-4">Historial de Progreso</h2>

    <div class="table-responsive">

        <table class="table table-striped table-hover">

            <thead class="table-dark">
                <tr>
                    <th>Cliente</th>
                    <th>Entrenador</th>
                    <th>Fecha</th>
                    <th>Peso</th>
                    <th>% Grasa</th>
                    <th>Observaciones</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="p : ${progresos}">
                    <td th:text="${p.cliente.nombreCompleto}"></td>
                    <td th:text="${p.entrenador.nombreCompleto}"></td>
                    <td th:text="${#temporals.format(p.fecha,'dd/MM/yyyy')}"></td>
                    <td th:text="${p.peso}"></td>
                    <td th:text="${p.porcentajeGrasa}"></td>
                    <td th:text="${p.observaciones}"></td>
                </tr>

            </tbody>

        </table>

    </div>

</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>

</html>
