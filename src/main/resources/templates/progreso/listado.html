<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container mt-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Historial de Progreso</h2>

        <a th:href="@{/progreso/nuevo}" class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i>
            Registrar progreso
        </a>
    </div>

    <div th:if="${todoOk}" class="alert alert-success" role="alert">
        <span th:text="${todoOk}"></span>
    </div>

    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/progreso/listado}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-md-6">
            <label class="form-label">Filtrar por cliente</label>
            <select name="cedula" class="form-select">
                <option value="">Todos los clientes</option>
                <option th:each="c : ${clientes}"
                        th:value="${c.cedula}"
                        th:selected="${c.cedula == cedula}"
                        th:text="${c.nombreCompleto + ' (' + c.cedula + ')'}">
                </option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">
                <i class="fa-solid fa-filter me-1"></i>
                Filtrar
            </button>
            <a th:href="@{/progreso/listado}" class="btn btn-outline-secondary ms-1">Limpiar</a>
        </div>
    </form>

    <div class="table-responsive">

        <table class="table table-striped table-hover">

            <thead class="table-dark">
                <tr>
                    <th>Cliente</th>
                    <th>Entrenador</th>
                    <th>Fecha</th>
                    <th>Peso</th>
                    <th>% Grasa</th>
                    <th>Observaciones</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="p : ${progresos}">
                    <td th:text="${p.cliente.nombreCompleto}"></td>
                    <td th:text="${p.entrenador.nombreCompleto}"></td>
                    <td th:text="${#temporals.format(p.fecha,'dd/MM/yyyy')}"></td>
                    <td th:text="${p.peso}"></td>
                    <td th:text="${p.porcentajeGrasa}"></td>
                    <td th:text="${p.observaciones}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(progresos)}">
                    <td colspan="6" class="text-center text-muted">No hay registros de progreso</td>
                </tr>

            </tbody>

        </table>

    </div>

</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>

</html>
