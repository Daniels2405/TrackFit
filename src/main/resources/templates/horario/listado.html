<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <!-- Incluye los estilos generales de TrackFit -->
    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <!-- Muestra el encabezado del sistema -->
        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-4 mb-5">

            <h2 class="mb-4">[[#{horario.administracion}]]</h2>

            <!-- Mensaje cuando el horario se registra correctamente -->
            <div th:if="${todoOk}" class="alert alert-success">
                <span th:text="${todoOk}"></span>
            </div>

            <!-- Mensaje cuando ocurre un error -->
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

            <!-- Formulario para registrar un nuevo horario -->
            <div class="card shadow-sm mb-4">

                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">[[#{horario.registrar}]]</h5>
                </div>

                <div class="card-body">

                    <form th:action="@{/horario/guardar}" method="post">

                        <!-- Selección de la actividad -->
                        <div class="mb-3">
                            <label class="form-label">[[#{horario.actividad}]]</label>

                            <select name="actividad.idActividad"
                                    class="form-select" required>

                                <option value="">[[#{horario.seleccione.actividad}]]</option>

                                <option th:each="a : ${actividades}"
                                        th:value="${a.idActividad}"
                                        th:text="${a.nombre}">
                                </option>

                            </select>
                        </div>

                        <!-- Fecha de la actividad -->
                        <div class="mb-3">
                            <label class="form-label">[[#{horario.fecha}]]</label>

                            <input type="date"
                                   name="fecha"
                                   class="form-control"
                                   required>
                        </div>

                        <!-- Hora de inicio -->
                        <div class="mb-3">
                            <label class="form-label">[[#{horario.hora.inicio}]]</label>

                            <input type="time"
                                   name="horaInicio"
                                   class="form-control"
                                   required>
                        </div>

                        <!-- Hora de finalización -->
                        <div class="mb-3">
                            <label class="form-label">[[#{horario.hora.fin}]]</label>

                            <input type="time"
                                   name="horaFin"
                                   class="form-control"
                                   required>
                        </div>

                        <!-- Cupo máximo de participantes -->
                        <div class="mb-3">
                            <label class="form-label">[[#{horario.cupo.maximo}]]</label>

                            <input type="number"
                                   name="cupoMaximo"
                                   class="form-control"
                                   min="1"
                                   required>
                        </div>

                        <!-- Botón para guardar el horario -->
                        <button type="submit" class="btn btn-primary">
                            [[#{horario.guardar}]]
                        </button>

                    </form>
                </div>
            </div>

            <!-- Tabla con los horarios registrados -->
            <h4 class="mb-3">[[#{horario.listado}]]</h4>

            <div class="table-responsive">

                <table class="table table-striped table-hover">

                    <thead class="table-dark">
                        <tr>
                            <th>[[#{general.id}]]</th>
                            <th>[[#{horario.actividad}]]</th>
                            <th>[[#{horario.fecha}]]</th>
                            <th>[[#{horario.hora.inicio}]]</th>
                            <th>[[#{horario.hora.fin}]]</th>
                            <th>[[#{horario.cupo.maximo}]]</th>
                            <!-- Columna para mostrar los espacios disponibles -->
                            <th>[[#{horario.cupos.disponibles}]]</th>
                        </tr>
                    </thead>

                    <tbody>

                        <!-- Recorre los horarios registrados -->
                        <tr th:each="h : ${horarios}">

                            <td th:text="${h.idHorario}"></td>

                            <td th:text="${h.actividad.nombre}"></td>

                            <td th:text="${#temporals.format(h.fecha, 'dd/MM/yyyy')}"></td>

                            <td th:text="${h.horaInicio}"></td>

                            <td th:text="${h.horaFin}"></td>

                            <td th:text="${h.cupoMaximo}"></td>



                            <!-- Muestra los espacios disponibles de cada horario -->
                            <td th:text="${espaciosDisponibles.get(h.idHorario)}"></td>



                        </tr>

                        <!-- Mensaje cuando no existen horarios -->
                        <tr th:if="${#lists.isEmpty(horarios)}">
                            <td colspan="7" class="text-center">
                                [[#{horario.lista.vacia}]]
                            </td>
                        </tr>

                    </tbody>
                </table>

            </div>

        </main>

        <!-- Incluye el pie de página de TrackFit -->
        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
