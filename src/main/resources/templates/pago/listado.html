<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <section th:replace="~{general/fragmentos :: titulo('fa-solid fa-money-bill-wave', 'Registro de pagos', 'Administración de pagos de membresías')}"></section>

        <main class="container mb-5">


            <div th:if="${todoOk}" class="alert alert-success" role="alert">
                <span th:text="${todoOk}"></span>
            </div>

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>


            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">Registrar nuevo pago</h5>
                </div>

                <div class="card-body">
                    <form th:action="@{/pago/guardar}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Membresía del cliente</label>
                            <select name="membresia.idMembresia"
                                    class="form-select" required>
                                <option value="">Seleccione una membresía</option>

                                <option th:each="m : ${membresias}"
                                        th:value="${m.idMembresia}"
                                        th:text="${m.usuario.nombreCompleto + ' - ' + m.planMembresia.nombre}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Monto del pago</label>
                            <input type="number"
                                   name="monto"
                                   class="form-control"
                                   min="0.01"
                                   step="0.01"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fecha del pago</label>
                            <input type="date"
                                   name="fecha"
                                   class="form-control"
                                   th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Método de pago</label>
                            <select name="metodoPago"
                                    class="form-select" required>
                                <option value="">Seleccione un método</option>
                                <option value="Efectivo">Efectivo</option>
                                <option value="Tarjeta">Tarjeta</option>
                                <option value="SINPE">SINPE</option>
                                <option value="Transferencia">Transferencia</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk me-1"></i>
                            Guardar pago
                        </button>
                    </form>
                </div>
            </div>

            <h4 class="mb-3">Historial de pagos</h4>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Cliente</th>
                            <th>Plan</th>
                            <th>Monto</th>
                            <th>Fecha</th>
                            <th>Método</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="p : ${pagos}">
                            <td th:text="${p.membresia.usuario.nombreCompleto}"></td>
                            <td th:text="${p.membresia.planMembresia.nombre}"></td>
                            <td th:text="${p.monto}"></td>
                            <td th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy')}"></td>
                            <td th:text="${p.metodoPago}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>

        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
